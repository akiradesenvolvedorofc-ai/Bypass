<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Bypass · Resolvedor Premium</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
    :root {
      --bg:#05060a; --surface:rgba(14,16,28,.78); --surface-2:rgba(24,27,44,.7);
      --primary:#7c5cff; --primary-glow:#a78bfa; --accent:#22d3ee;
      --text:#f1f5f9; --text-muted:#94a3b8; --border:rgba(148,163,184,.12);
      --success:#34d399; --error:#f87171; --radius:24px;
    }
    body.light {
      --bg:#eef2f7; --surface:rgba(255,255,255,.88); --surface-2:rgba(241,245,249,.92);
      --primary:#6d28d9; --primary-glow:#8b5cf6; --accent:#0891b2;
      --text:#0f172a; --text-muted:#475569; --border:rgba(148,163,184,.3);
    }
    body {
      background:var(--bg); color:var(--text); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px;
      background-image: radial-gradient(circle at 10% 10%, rgba(124,92,255,.18), transparent 45%),
                        radial-gradient(circle at 90% 90%, rgba(34,211,238,.12), transparent 45%);
    }
    .app {
      width:100%; max-width:820px; background:var(--surface);
      backdrop-filter:blur(28px) saturate(180%); border:1px solid var(--border);
      border-radius:var(--radius); padding:44px 40px;
      box-shadow:0 25px 60px -15px rgba(0,0,0,.9); position:relative; overflow:hidden;
    }
    .app::before { content:''; position:absolute; top:-100px; right:-100px; width:260px; height:260px;
      background:var(--primary); filter:blur(120px); opacity:.25; border-radius:50%; pointer-events:none; }
    .app::after { content:''; position:absolute; bottom:-100px; left:-100px; width:240px; height:240px;
      background:var(--accent); filter:blur(120px); opacity:.18; border-radius:50%; pointer-events:none; }

    .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:36px; position:relative; z-index:2; }
    .header-left h1 {
      font-size:2.2rem; font-weight:800; letter-spacing:-.04em;
      background:linear-gradient(135deg,var(--primary-glow),var(--accent));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      display:flex; align-items:center; gap:12px;
    }
    .header-left h1 i { -webkit-text-fill-color:var(--primary-glow); font-size:2rem; }
    .header-left p { color:var(--text-muted); font-size:.9rem; margin-top:8px; max-width:460px; line-height:1.6; }
    .icon-btn {
      background:var(--surface-2); border:1px solid var(--border); color:var(--text);
      width:48px; height:48px; border-radius:14px; cursor:pointer; display:flex;
      align-items:center; justify-content:center; transition:.2s; font-size:1.2rem;
    }
    .icon-btn:hover { background:var(--border); transform:scale(1.05); }

    .service-tabs { display:flex; gap:8px; margin-bottom:20px; position:relative; z-index:2; flex-wrap:wrap; }
    .service-tab {
      padding:8px 16px; border-radius:10px; border:1px solid var(--border);
      background:var(--surface-2); color:var(--text-muted); font-size:.8rem;
      font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;
    }
    .service-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 4px 16px rgba(124,92,255,.35); }

    .input-label { display:block; font-size:.8rem; font-weight:600; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em; }
    .input-wrapper { display:flex; gap:10px; }
    .input-icon { position:relative; flex:1; }
    .input-icon i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:1.1rem; }
    .input-icon input {
      width:100%; padding:16px 16px 16px 48px; border-radius:14px;
      border:1px solid var(--border); background:var(--surface-2); color:var(--text);
      font-size:.95rem; outline:none; transition:.2s;
    }
    .input-icon input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(124,92,255,.15); }

    .btn {
      border:none; border-radius:14px; padding:16px 24px; font-size:.95rem;
      font-weight:700; cursor:pointer; transition:.2s; display:inline-flex;
      align-items:center; justify-content:center; gap:8px; white-space:nowrap;
    }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-glow)); color:#fff; box-shadow:0 8px 24px rgba(124,92,255,.35); }
    .btn-primary:hover { filter:brightness(1.1); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-ghost { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--border); }

    .result-box { margin-top:24px; padding:20px; border-radius:16px; border:1px solid var(--border); background:var(--surface-2); display:none; position:relative; z-index:2; }
    .result-box.visible { display:block; animation:fadeInUp .35s ease; }
    .result-box.success { border-color:var(--success); background:rgba(52,211,153,.08); }
    .result-box.error { border-color:var(--error); background:rgba(248,113,113,.08); }
    .result-label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
    .result-content { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .result-content a, .result-content span { flex:1; word-break:break-all; font-size:.95rem; font-weight:500; color:var(--text); text-decoration:none; }
    .result-content a:hover { text-decoration:underline; color:var(--primary-glow); }
    .btn-copy { padding:10px 16px; font-size:.8rem; border-radius:10px; }

    .loading { display:none; align-items:center; gap:12px; margin-top:20px; color:var(--text-muted); font-size:.85rem; position:relative; z-index:2; }
    .loading.visible { display:flex; }
    .spinner { width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    @media (max-width:620px) {
      .app { padding:28px 20px; }
      .header-left h1 { font-size:1.5rem; }
      .input-wrapper { flex-direction:column; }
      .btn { width:100%; }
      .result-content { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <h1><i data-lucide="zap"></i> Nexus Bypass</h1>
        <p>Resolvedor premium. O backend tenta resolver o link no servidor e devolve o destino final.</p>
      </div>
      <button class="icon-btn" id="themeToggle" title="Alternar tema"><i data-lucide="moon"></i></button>
    </div>

    <div class="service-tabs">
      <button class="service-tab active" data-service="lootlabs"><i data-lucide="link"></i> LootLabs</button>
      <button class="service-tab" data-service="linkvertise"><i data-lucide="link-2"></i> Linkvertise</button>
      <button class="service-tab" data-service="workink"><i data-lucide="briefcase"></i> Work.ink</button>
    </div>

    <label class="input-label" for="linkInput">Link do serviço</label>
    <div class="input-wrapper">
      <div class="input-icon">
        <i data-lucide="link"></i>
        <input type="url" id="linkInput" placeholder="https://links.lootlabs.gg/s?…" autocomplete="off" spellcheck="false" />
      </div>
      <button class="btn btn-ghost" id="pasteBtn"><i data-lucide="clipboard-paste"></i> Colar</button>
      <button class="btn btn-primary" id="bypassBtn"><i data-lucide="zap"></i> Bypass</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span id="loadingText">Resolvendo no servidor…</span>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-label" id="resultLabel"><i data-lucide="check-circle"></i> Resultado</div>
      <div class="result-content">
        <a href="#" id="resultLink" target="_blank" rel="noopener noreferrer"></a>
        <span id="resultError" style="display:none;"></span>
        <button class="btn btn-ghost btn-copy" id="copyBtn" style="display:none;"><i data-lucide="copy"></i> Copiar</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // ⚠️ SUBSTITUA PELA URL DO SEU BACKEND HOSPEDADO (Render/Railway/etc.)
    const BACKEND_URL = 'https://SEU-BACKEND-AQUI.onrender.com/api/bypass';

    const linkInput = document.getElementById('linkInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const bypassBtn = document.getElementById('bypassBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const resultBox = document.getElementById('resultBox');
    const resultLabel = document.getElementById('resultLabel');
    const resultLink = document.getElementById('resultLink');
    const resultError = document.getElementById('resultError');
    const copyBtn = document.getElementById('copyBtn');
    const themeToggle = document.getElementById('themeToggle');

    // Tema
    function applyTheme(theme) {
      document.body.classList.toggle('light', theme === 'light');
      themeToggle.innerHTML = theme === 'light' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      lucide.createIcons();
      localStorage.setItem('nexus_theme', theme);
    }
    themeToggle.addEventListener('click', () => {
      applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
    });
    applyTheme(localStorage.getItem('nexus_theme') || 'dark');

    // Colar
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        linkInput.value = text.trim();
        linkInput.focus();
      } catch { alert('Permissão negada. Cole manualmente (Ctrl+V).'); }
    });

    // Copiar
    copyBtn.addEventListener('click', async () => {
      if (!resultLink.href) return;
      try {
        await navigator.clipboard.writeText(resultLink.href);
        copyBtn.innerHTML = '<i data-lucide="check"></i> Copiado!';
        lucide.createIcons();
        setTimeout(() => { copyBtn.innerHTML = '<i data-lucide="copy"></i> Copiar'; lucide.createIcons(); }, 1500);
      } catch { alert('Não foi possível copiar.'); }
    });

    // UI
    function showResult(url) {
      resultBox.className = 'result-box visible success';
      resultLabel.innerHTML = '<i data-lucide="check-circle"></i> Link resolvido com sucesso';
      resultLink.href = url;
      resultLink.textContent = url;
      resultLink.style.display = 'block';
      resultError.style.display = 'none';
      copyBtn.style.display = 'inline-flex';
      lucide.createIcons();
    }
    function showError(msg) {
      resultBox.className = 'result-box visible error';
      resultLabel.innerHTML = '<i data-lucide="alert-circle"></i> Falha no bypass';
      resultLink.style.display = 'none';
      resultError.style.display = 'block';
      resultError.textContent = msg;
      copyBtn.style.display = 'none';
      lucide.createIcons();
    }

    // Bypass via backend
    async function doBypass() {
      const url = linkInput.value.trim();
      if (!url) { showError('Cole um link antes de continuar.'); return; }

      resultBox.className = 'result-box';
      loading.classList.add('visible');
      bypassBtn.disabled = true;
      bypassBtn.innerHTML = '<i data-lucide="loader-2"></i> Resolvendo…';
      lucide.createIcons();

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!res.ok) throw new Error(`Servidor retornou HTTP ${res.status}`);

        const data = await res.json();
        if (data.success && data.result && data.result.startsWith('http')) {
          showResult(data.result);
        } else {
          throw new Error(data.error || 'O backend não retornou um link válido.');
        }
      } catch (err) {
        console.error(err);
        showError(err.message || 'Erro ao conectar com o servidor de bypass.');
      } finally {
        loading.classList.remove('visible');
        bypassBtn.disabled = false;
        bypassBtn.innerHTML = '<i data-lucide="zap"></i> Bypass';
        lucide.createIcons();
      }
    }

    bypassBtn.addEventListener('click', doBypass);
    linkInput.addEventListener('keydown', e => { if (e.key === 'Enter') doBypass(); });
  </script>
</body>
</html>
